name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'

      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'

      - name: Verificar formatação e análise estática
        run: ./gradlew ktlintCheck detekt

      - name: Executar testes, incluindo interface Desktop
        run: xvfb-run -a ./gradlew allTests

      - name: Compilar Android e Desktop
        run: ./gradlew assembleDebug desktopJar

      - name: Publicar relatórios e capturas de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-1-verificacao
          path: |
            composeApp/build/reports/
            composeApp/build/test-results/

      - name: Publicar APK e JAR
        uses: actions/upload-artifact@v4
        with:
          name: revysa-sprint-1
          path: |
            composeApp/build/outputs/apk/debug/*.apk
            composeApp/build/libs/*.jar
